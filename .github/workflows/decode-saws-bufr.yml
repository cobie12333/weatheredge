name: Decode SAWS BUFR sample

on:
  push:
    branches:
      - feature/settlement-and-imatros5-fusion

jobs:
  decode-saws-bufr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools python3-eccodes
      - name: Decode SAWS sample
        run: |
          cat > /tmp/fact.bufr.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/fact.bufr.b64 > /tmp/fact.bufr
          bufr_dump -p /tmp/fact.bufr > /tmp/fact.txt
          cat /tmp/fact.txt
          echo "---- KEYS ----"
          bufr_dump -j -p /tmp/fact.bufr | grep -Ei 'airTemperature|temperature|dewpoint|humidity|windSpeed|windDirection|pressure|station|datetime|year|month|day|hour|minute' || true
