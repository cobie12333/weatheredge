name: WeatherEdge CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q weatheredge
      - name: Fresh database and nearby PWS watchlist smoke test
        run: |
          python - <<'PY'
          import os
          import tempfile
          import weatheredge.db as db
          from weatheredge.nearby_pws_watchlist import PWS_WATCHLIST
          from weatheredge.pws_discovery import seed_watchlist

          assert len(PWS_WATCHLIST) == 65
          ids = [station["station_id"] for station in PWS_WATCHLIST]
          assert len(ids) == len(set(ids)), "watchlist contains duplicate IDs"
          assert all(not station["enabled"] for station in PWS_WATCHLIST)

          with tempfile.TemporaryDirectory() as d:
              db.DB_PATH = os.path.join(d, "weatheredge.db")
              db.SCHEMA_PATH = os.path.abspath("weatheredge/schema.sql")
              db._SCHEMA_READY = False
              db.init_schema()
              con = db.get_connection()
              tables = {r["name"] for r in con.execute(
                  "select name from sqlite_master where type='table'"
              )}
              required = {
                  "metar_obs", "metar_parsed", "pws_obs", "saws_obs",
                  "saws_forecast", "metar_multi", "pws_station",
                  "pws_obs_multi", "market_price_multi",
                  "outcome_multi", "forecast_history_multi",
                  "market_price", "outcome", "collection_log",
                  "forecast_history",
              }
              missing = required - tables
              assert not missing, missing

              inserted = seed_watchlist(con)
              assert inserted == 65, inserted
              assert seed_watchlist(con) == 0, "watchlist seed is not idempotent"
              rows = con.execute(
                  "SELECT station_id, verified, enabled, latitude, longitude, distance_km "
                  "FROM pws_station"
              ).fetchall()
              assert len(rows) == 65, len(rows)
              assert all(r["verified"] == 0 and r["enabled"] == 0 for r in rows)
              assert all(r["latitude"] is None and r["longitude"] is None
                         and r["distance_km"] is None for r in rows)
              con.close()
          PY
      - name: PWS collector parser and unit smoke test
        run: |
          python - <<'PY'
          from weatheredge import pws_multi_collector
          row = pws_multi_collector._observation_to_row(
              {"epoch": 1770000000, "humidity": 55, "winddir": 180,
               "metric": {"temp": 24.5, "dewpt": 14.0, "windSpeed": 9.26, "pressure": 1012.3}},
              {"station_id":"TEST1","airport_icao":"FACT","latitude":-33.97,
               "longitude":18.60,"distance_km":1.0})
          assert row["temp_c"] == 24.5
          assert row["dewpoint_c"] == 14.0
          assert abs(row["wind_speed_kt"] - 5.0) < 1e-9, row["wind_speed_kt"]
          assert row["obs_time"].endswith("Z")
          PY
      - name: PWS live activation quality gate
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from weatheredge.pws_live_activation import validate_observation

          now = datetime.now(timezone.utc)
          good = {
              "stationID": "IMATRO5",
              "qcStatus": 1,
              "epoch": int(now.timestamp()),
              "lat": -33.986,
              "lon": 18.601,
              "metric": {"temp": 18.2},
          }
          verified, reason = validate_observation("IMATRO5", "FACT", good, now=now)
          assert reason is None, reason
          assert verified["temp_c"] == 18.2
          assert verified["distance_km"] > 0

          bad_qc = dict(good, qcStatus=0)
          assert validate_observation("IMATRO5", "FACT", bad_qc, now=now)[1] == "quality_control_not_passed"
          wrong_id = dict(good, stationID="OTHER")
          assert validate_observation("IMATRO5", "FACT", wrong_id, now=now)[1] == "station_id_mismatch"
          stale = dict(good, epoch=int(now.timestamp()) - 7200)
          assert validate_observation("IMATRO5", "FACT", stale, now=now)[1] == "observation_stale"
          PY
      - name: Live runner failure isolation and launcher import smoke test
        run: |
          python - <<'PY'
          from weatheredge import live_runner, go_live

          assert live_runner._minutes_for_market({"tz":"Africa/Johannesburg"}) in (15, 60)
          assert callable(go_live.main)

          calls = []
          class FakeConnection:
              def close(self):
                  calls.append("closed")

          original_get_connection = live_runner.get_connection
          original_log_attempt = live_runner.log_collection_attempt
          live_runner.get_connection = lambda: FakeConnection()
          live_runner.log_collection_attempt = lambda con, name, success, **kw: calls.append(
              (name, success, kw.get("error_msg", ""))
          )
          try:
              assert live_runner._run_collector("healthy", lambda: 7) == 7

              def broken_collector():
                  raise RuntimeError("simulated collector failure")

              assert live_runner._run_collector("broken", broken_collector) == 0
              assert ("broken", False, "Unhandled collector exception: RuntimeError: simulated collector failure") in calls
              assert calls[-1] == "closed"
          finally:
              live_runner.get_connection = original_get_connection
              live_runner.log_collection_attempt = original_log_attempt
          PY
      - name: FACT lag analysis reads canonical multi-airport tables
        run: |
          python - <<'PY'
          import os
          import sqlite3
          import tempfile
          from weatheredge.analysis import lag_analysis

          with tempfile.TemporaryDirectory() as d:
              con = sqlite3.connect(os.path.join(d, "test.db"))
              con.row_factory = sqlite3.Row
              with open("weatheredge/schema.sql", encoding="utf-8") as f:
                  con.executescript(f.read())

              con.execute(
                  """INSERT INTO metar_multi
                     (station_id, fetched_at, obs_time, receipt_time, temp_c,
                      raw_metar, report_type, source)
                     VALUES ('FACT', '2026-10-31T10:05:00Z',
                             '2026-10-31T10:00:00Z', '2026-10-31T10:01:00Z',
                             24, 'FACT 311000Z 18010KT 9999 FEW020 24/12 Q1015',
                             'METAR', 'aviationweather.gov')"""
              )
              con.execute(
                  """INSERT INTO market_price_multi
                     (station_id, market_date, fetched_at, bucket_label,
                      yes_price_cents, no_price_cents, volume_usd, raw_payload)
                     VALUES ('FACT', '2026-10-31', '2026-10-31T10:06:00Z',
                             '24°C', 85, 15, 100, '{}')"""
              )
              con.execute(
                  """INSERT INTO collection_log
                     (attempted_at, collector, success, rows_written)
                     VALUES ('2026-10-31T10:05:00Z', 'multi_metar', 1, 1)"""
              )
              con.execute(
                  """INSERT INTO collection_log
                     (attempted_at, collector, success, rows_written)
                     VALUES ('2026-10-31T10:06:00Z', 'market:FACT', 1, 1)"""
              )
              lag_analysis.install_analysis_views(con)

              daily = lag_analysis.get_daily_max_from_metar(con, "2026-10-31")
              assert daily["max_temp_c"] == 24
              assert daily["n_obs"] == 1
              snapshot = lag_analysis.get_latest_market_snapshot(con, "2026-10-31")
              assert snapshot["buckets"][0]["bucket_label"] == "24°C"
              health = lag_analysis.compute_collection_health_for_day(con, "2026-10-31")
              assert health["metar"]["successes"] == 1
              assert health["market"]["successes"] == 1
              latency = lag_analysis.compute_collector_latency_minutes(con, "2026-10-31")
              assert latency["median_latency_min"] == 5
              con.close()
          PY
      - name: Dashboard render smoke test
        run: |
          python - <<'PY'
          from weatheredge import dashboard
          html = dashboard.render([
              {
                  "icao":"FACT","city":"Cape Town","country":"ZA",
                  "tz":"Africa/Johannesburg","temp_c":25.0,
                  "dewpoint_c":12.0,"wind_dir_deg":180.0,
                  "wind_speed_kt":5.0,"obs_time":None,
                  "report_type":"METAR","raw_metar":None,
                  "temp_change":None,"age_min":None,
                  "status":"NO DATA","pws":[]
              }
          ])
          assert "<!doctype html>" in html
          assert "function apply()" in html
          assert "function fillAirportSelect(){" in html
          PY
